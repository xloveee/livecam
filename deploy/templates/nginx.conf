# livecam reverse proxy — signaling only (WHIP/WHEP/chat/static).
# WebRTC UDP media goes directly to the SFU on port 50000, not through nginx.
# Placeholders: __DOMAIN__

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # M12: TLS vhost security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'" always;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # WebSocket — required for chat
    # proxy_pass without a URI path: keep /api/... (a trailing slash on the
    # upstream URL would strip the location prefix).
    location /api/chat/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else (HTTP API, static files, WHIP/WHEP)
    location / {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:8443; # no path strip
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$server_name$request_uri;
}
