# Temporary HTTP-only server for ACME / first boot.
# Replaced by nginx.conf after certificates exist.
# H19: never proxy the app on :80. ACME challenge only.
# Placeholders: __DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
