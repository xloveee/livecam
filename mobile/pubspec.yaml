name: livecam_mobile
description: Mobile streaming client for livecam — WHIP/WHEP, chat, RTMP to Twitch/Kick.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.11.7
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  video_player: ^2.9.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
